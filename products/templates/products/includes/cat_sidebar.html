<div class="col-lg-3 col-md-4">
    <div class="sidebar">
        <button class="btn btn-warning w-100 text-start collapse-filters-btn mb-3" type="button"
                data-bs-toggle="collapse" data-bs-target="#collapseFilters" aria-expanded="false"
                aria-controls="collapseExample">
            <i class="fa-solid fa-filter"></i> Фильтры
        </button>
        <div class="collapse collapse-filters" id="collapseFilters">
            <form action="{% url 'category_list' category.slug %}" method="get">
                <div class="filter-block">
                    <h5 class="section-title"><span>Фильтровать по типу</span></h5>
                    {% for key, val in category_types.items %}
                    <div class="form-check d-flex justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox"
                                   name="type" value="{{ key.id }}">
                            <label class="form-check-label">
                                {{ key.name }}
                            </label>
                        </div>
                        <span class="badge border rounded-0">{{ val }}</span>
                    </div>
                    {% endfor %}
                </div>

                <div class="filter-block">
                    <h5 class="section-title"><span>Фильтровать по материалу</span></h5>
                    {% for key, val in category_materials.items %}
                    <div class="form-check d-flex justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox"
                                   name="material" value="{{ key.id }}">
                            <label class="form-check-label">
                                {{ key.name }}
                            </label>
                        </div>
                        <span class="badge border rounded-0">{{ val }}</span>
                    </div>
                    {% endfor %}
                </div>

                <div class="filter-block">
                    <h5 class="section-title"><span>Фильтровать по наличию</span></h5>
                    <div class="form-check d-flex justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox"
                                   name="is_available" value="true">
                            <label class="form-check-label">
                                В магазинах
                            </label>
                        </div>
                        <span class="badge border rounded-0">{{ available_num }}</span>
                    </div>
                    <div class="form-check d-flex justify-content-between">
                        <div>
                            <input class="form-check-input" type="checkbox"
                                   name="is_available" value="false">
                            <label class="form-check-label">
                                Под заказ
                            </label>
                        </div>
                        <span class="badge border rounded-0">{{ not_available_num }}</span>
                    </div>
                </div>
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-secondary btn-lg">
                        Показать
                    </button>
                </div>
            </form>
        </div>
    </div>
</div> <!-- Sidebar -->
